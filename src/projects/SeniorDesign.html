<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senior Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/stylesheets/output.css">
  <script src="/src/scripts/common.js"></script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
  <script src="/src/scripts/media-gallery.js"></script>
</head>

<body class="body">
  <div id="navbar-placeholder"></div>
  <!-- Header -->
  <header class="bg-white">
    <div class="detail-page-header">
      <a href="javascript:history.back()" class="detail-page-header-back">←
        Back</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <section class="detail-page-section">
      <h2 class="text-3xl font-semibold mb-4">Boise State Senior Design</h2>
      <p class="detail-page-text">sample text here :)</p>



      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- existing wheelchair CAD Model -->
        <div class="project-media">
          <h3 class="text-xl font-medium mb-2">Existing Wheelchair</h3>
          <p class="detail-page-text">Explore the 3D CAD model of the existing wheelchair.</p>
          <img src="/assets/Senior Design/CadThumbnail.png" alt="" />
          <a href="/assets/Senior Design/2-12-26ExistingWheelchair.html" target="_blank"
            class="see-more-details-button">Open
            <i class="fas fa-external-link-alt ml-2"></i></a>
        </div>
        <!-- modified wheelchair CAD Model -->
        <div class="project-media">
          <h3 class="text-xl font-medium mb-2">Our Design</h3>
          <p class="detail-page-text">Explore the 3D CAD model of our design.</p>
          <img src="/assets/Senior Design/modifiedthumbnail.png" alt="" />
          <a href="/assets/Senior Design/3-26-26ModifiedWheelchair.html" target="_blank"
            class="see-more-details-button">Open
            <i class="fas fa-external-link-alt ml-2"></i></a>
        </div>
        <!-- Enlargeable Image -->
        <div id="enlargeableImageModal" class="enlargeable-modal">
          <span class="close enlargeable-modal-close android-hidden">&times;</span>
          <img class="enlargeable-modal-content" id="enlargeableModalImage">
        </div>

      </div>
    </section>
    <!-- Back Button at the Bottom -->
    <div class="text-center mt-8 android-hidden" id="backButton">
      <a href="javascript:history.back()" class="back-button-link">Back</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-main">
    <div class="footer-container">
      <p>&copy; <span class="year"></span> <span class="my-name"></span>. All rights reserved.</p>
    </div>
  </footer>

  <script src="/src/scripts/enlargeImage.js"></script>
</body>

</html>
